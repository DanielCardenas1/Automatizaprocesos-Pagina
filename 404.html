<style>
:root{--ink:#101213;--gold-l:#e6d2ab;--mut:rgba(255,255,255,.78)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink);color:#fff;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}

header{padding:22px 6vw}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font:500 16px 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.brand img{width:34px;height:34px;object-fit:contain}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 6vw 72px;max-width:760px}
.eyebrow{font:500 12px/1.45 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l);margin:0 0 18px}
h1{font:500 clamp(34px,5vw,56px)/1.08 'Cormorant Garamond',Georgia,serif;margin:0 0 18px}
h1 em{font-style:italic;color:var(--gold-l)}
p{font-size:16px;line-height:1.6;color:var(--mut);margin:0 0 28px;max-width:52ch}
.actions{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 26px;border-radius:999px;background:var(--gold-l);color:var(--ink);font:600 15px 'DM Sans',system-ui,sans-serif;text-decoration:none}
.link{font-size:15px;text-underline-offset:6px;text-decoration-color:rgba(255,255,255,.4)}
.link:hover{text-decoration-color:var(--gold-l)}
</style>
</head>
